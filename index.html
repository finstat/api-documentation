<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/png" sizes="32x32" href="https://www.finstat.sk/favicon-32x32.png">

  <!--link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" /-->
  <link rel="stylesheet" href="https://unpkg.com/docsify-themeable/dist/css/theme-simple.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">Please wait...</div>
  <script>
    window.$docsify = {
      name: 'FinStat API',
      repo: '',
      loadNavbar: true,
      loadSidebar: true,
      logo: null,
      plugins: [
        // shared fragments tag tier-specific content with data-tier="elite ultimate":
        // a row whose first marker (<i data-tier>) excludes the page tier is removed, other tagged elements likewise
        function (hook, vm) {
          var tiers = { invoice: 'invoice', basic: 'basic', premiumcz: 'premium', elitecz: 'elite', ultimatecz: 'ultimate' };
          hook.afterEach(function (html) {
            var page = (vm.route.path.split('/').pop() || '').replace(/\.md$/, '').toLowerCase();
            var tier = tiers[page];
            if (!tier) {
              return html;
            }
            var tpl = document.createElement('template');
            tpl.innerHTML = html;
            tpl.content.querySelectorAll('[data-tier]').forEach(function (el) {
              var show = el.getAttribute('data-tier').split(/\s+/).indexOf(tier) >= 0;
              var row = el.tagName === 'I' ? el.closest('tr') : null;
              if (row) {
                (show ? el : row).remove();
              } else if (!show) {
                el.remove();
              }
            });
            return tpl.innerHTML;
          });
        }
      ],
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-csharp.js"></script>

  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-aspnet.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.js"></script>
</body>
</html>
